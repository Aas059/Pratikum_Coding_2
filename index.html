      margin: 0;

    .card {
      background-color: rgb(82, 82, 224);
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px lab(59.92% -59.39 58.47 / 0.1);

    .card:hover {

    }

    .card h1 {
      text-align: center;
      color: #f5f5f5;
      margin-bottom: 20px;
    }

    .profile-img {
      display: block;
      margin: 0 auto 20px;
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #e91fbd;
      box-shadow: 0 4px 10px rgba(30, 9, 107, 0.15);
    }

    .info {
      font-size: 16px;
      line-height: 1.8;
      color: #a1087b;
    }

    .info strong {
      color: #e7dee5;
      display: inline-block;
      width: 150px;
    }

    hr {
      margin-top: 30px;
      border: none;
      border-top: 1px solid #f5f5f5;
    }

    @media screen and (max-width: 600px) {
      .card {
        margin: 20px;
        padding: 20px;
      }

    }
